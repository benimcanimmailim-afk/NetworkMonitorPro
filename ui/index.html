<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Monitor Pro v5 - NOC Edition</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-shield-alt"></i>
                <span>ULTRA NET v5</span>
            </div>
            <nav>
                <div class="nav-item active" onclick="showView('dashboard')">
                    <i class="fas fa-th-large"></i>
                    <span>Dashboard</span>
                </div>
                <div class="nav-item" onclick="showView('discovery')">
                    <i class="fas fa-search-location"></i>
                    <span>Discovery</span>
                </div>
                <div class="nav-item" onclick="showView('settings')">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                </div>
            </nav>
            <div class="package-section">
                <label>Active Package</label>
                <select id="packageSelect" onchange="loadPackage()">
                    <option value="">No Package</option>
                </select>
                <div class="package-actions">
                    <button onclick="savePackage()" title="Save Current"><i class="fas fa-save"></i></button>
                    <button onclick="deletePackage()" title="Delete Selected"><i class="fas fa-trash"></i></button>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search IP or Tag..." oninput="filterDevices()">
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary" onclick="openAddModal()">
                        <i class="fas fa-plus"></i> Bulk Add
                    </button>
                    <button class="btn btn-secondary" onclick="resetDashboard()">
                        <i class="fas fa-redo"></i> Reset
                    </button>
                </div>
            </header>

            <div id="dashboardView" class="view">
                <div class="stats-overview">
                    <div class="stat-card">
                        <div class="stat-icon online"><i class="fas fa-check-circle"></i></div>
                        <div class="stat-info">
                            <span class="stat-value" id="onlineCount">0</span>
                            <span class="stat-label">Online</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon offline"><i class="fas fa-times-circle"></i></div>
                        <div class="stat-info">
                            <span class="stat-value" id="offlineCount">0</span>
                            <span class="stat-label">Offline</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon total"><i class="fas fa-server"></i></div>
                        <div class="stat-info">
                            <span class="stat-value" id="totalCount">0</span>
                            <span class="stat-label">Total Devices</span>
                        </div>
                    </div>
                </div>

                <div class="device-grid" id="deviceGrid">
                    <!-- Device cards will be injected here -->
                </div>
            </div>

            <div id="discoveryView" class="view" style="display: none;">
                <div class="discovery-container">
                    <h2>Network Discovery</h2>
                    <div class="discovery-form">
                        <div class="input-group">
                            <label>Start IP</label>
                            <input type="text" id="scanStart" value="192.168.1.1">
                        </div>
                        <div class="input-group">
                            <label>End IP</label>
                            <input type="text" id="scanEnd" value="192.168.1.254">
                        </div>
                        <button class="btn btn-success" id="scanBtn" onclick="startDiscovery()">Start Scan</button>
                    </div>
                    <div class="progress-container" id="scanProgress" style="display: none;">
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" id="progressBar"></div>
                        </div>
                        <span id="progressText">0/0</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <h3>Bulk Add IPs</h3>
            <textarea id="bulkIps" placeholder="Paste IPs separated by space, comma or newline..."></textarea>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('addModal')">Cancel</button>
                <button class="btn btn-primary" onclick="confirmBulkAdd()">Add IPs</button>
            </div>
        </div>
    </div>

    <!-- Context Menu -->
    <div id="contextMenu" class="context-menu">
        <div class="menu-item" onclick="handleMenuAction('tag')"><i class="fas fa-tag"></i> Edit Tag</div>
        <div class="menu-item" onclick="handleMenuAction('hostname')"><i class="fas fa-id-badge"></i> Find Hostname</div>
        <div class="menu-item" onclick="handleMenuAction('manufacturer')"><i class="fas fa-industry"></i> Find Manufacturer</div>
        <div class="menu-item" onclick="handleMenuAction('web')"><i class="fas fa-globe"></i> Open Web UI</div>
        <div class="menu-separator"></div>
        <div class="menu-item" onclick="handleMenuAction('ports')"><i class="fas fa-plug"></i> Scan Ports</div>
        <div class="menu-item" onclick="handleMenuAction('traceroute')"><i class="fas fa-route"></i> Trace Route</div>
        <div class="menu-separator"></div>
        <div class="menu-item" onclick="handleMenuAction('ssh')"><i class="fas fa-terminal"></i> SSH Connect</div>
        <div class="menu-item" onclick="handleMenuAction('rdp')"><i class="fas fa-desktop"></i> RDP Connect</div>
        <div class="menu-separator"></div>
        <div class="menu-item text-danger" onclick="handleMenuAction('delete')"><i class="fas fa-trash"></i> Delete Row</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
